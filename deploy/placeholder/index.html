<!doctype html>
<!-- Placeholder website on :3000 until Yudi's Next.js app is deployed. Tests camera + mic over real HTTPS. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlinkTalk server check</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; background: #fff; color: #111; }
    button { font-size: 20px; padding: 14px 22px; border-radius: 10px; border: 0; background: #2563eb; color: #fff; }
    video { width: 100%; margin-top: 16px; border-radius: 10px; background: #000; transform: scaleX(-1); }
    li { margin: 6px 0; font-size: 18px; }
  </style>
</head>
<body>
  <h1>BlinkTalk server is up</h1>
  <p>Placeholder page. The real app replaces this.</p>
  <ul>
    <li id="https">HTTPS: …</li>
    <li id="api">API /api/health: …</li>
    <li id="cam">Camera: not tested</li>
    <li id="mic">Microphone: not tested</li>
  </ul>
  <button id="test">Test camera and mic</button>
  <video id="video" autoplay playsinline muted></video>

  <script>
    const $ = (id) => document.getElementById(id);
    $("https").textContent = "HTTPS: " + (window.isSecureContext ? "✅ secure" : "❌ not secure (camera will be blocked)");

    fetch("/api/health").then(r => r.json())
      .then(d => $("api").textContent = "API /api/health: " + (d.ok ? "✅ ok" : "❌ " + JSON.stringify(d)))
      .catch(e => $("api").textContent = "API /api/health: ❌ " + e);

    $("test").onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        $("video").srcObject = stream;
        $("cam").textContent = "Camera: " + (stream.getVideoTracks().length ? "✅ allowed" : "❌ no track");
        $("mic").textContent = "Microphone: " + (stream.getAudioTracks().length ? "✅ allowed" : "❌ no track");
      } catch (e) {
        $("cam").textContent = "Camera/mic: ❌ " + e.name + " — " + e.message;
      }
    };
  </script>
</body>
</html>
